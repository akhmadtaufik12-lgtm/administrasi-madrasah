    <!-- Global WebStorage Quota Guard: Protects Firestore and Browser from QuotaExceededError crashes -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.Storage) {
            var purgeLegacy = function() {
              try {
                var keysToRemove = [];
                for (var i = 0; i < localStorage.length; i++) {
                  var k = localStorage.key(i);
                  if (k && (k.indexOf('firestore_') === 0 || k.indexOf('sequence_number') !== -1 || k.indexOf('mts_db_snapshots_') === 0 || k === 'mts_manbaul_database_backups_v1')) {
                    keysToRemove.push(k);
                  }
                }
                for (var j = 0; j < keysToRemove.length; j++) {
                  localStorage.removeItem(keysToRemove[j]);
                }
              } catch (e) {}
            };
            purgeLegacy();

            var origSetItem = Storage.prototype.setItem;
            Storage.prototype.setItem = function(key, val) {
              try {
                origSetItem.call(this, key, val);
              } catch (err) {
                if (err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014 || String(err).indexOf('quota') !== -1)) {
                  console.warn('[Storage Protection] Quota reached when setting: ' + key);
                  purgeLegacy();
                  try {
                    origSetItem.call(this, key, val);
                  } catch (retryErr) {
                    // Safely absorb so it does not crash Firestore AsyncQueue or application
                    console.warn('[Storage Protection] Safely absorbed QuotaExceededError for: ' + key);
                  }
                } else {
                  throw err;
                }
              };
            };
          }
        } catch (e) {}
      })();
    </script>

    <!-- Service Worker Registration for Web Push Notifications -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('✅ ServiceWorker Registered successfully:', registration.scope);
            })
            .catch(function(err) {
              console.log('⚠️ ServiceWorker registration note:', err);
            });
        });
      }
    </script>
